name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"    # runs once a day
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MAZ-MG15
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23d65d0e&color_dots=%233c3836,%23504945,%23d79921,%2398971a,%23689d6a
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23d65d0e&color_dots=%23282828,%23504945,%23d79921,%2398971a,%23689d6a

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
